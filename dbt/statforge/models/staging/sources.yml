version: 2

sources:
  - name: statforge
    database: statforge
    schema: public
    description: "Raw StatForge PostgreSQL tables"
    tables:
      - name: experiments
        description: "One row per A/B experiment"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: name
            tests:
              - not_null

      - name: experiment_assignments
        description: "User variant assignments per experiment"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: experiment_id
            tests:
              - not_null
              - relationships:
                  to: source('statforge', 'experiments')
                  field: id
          - name: variant
            tests:
              - accepted_values:
                  values: ["control", "treatment"]

      - name: experiment_results
        description: "Statistical test results per experiment and metric"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: experiment_id
            tests:
              - not_null
              - relationships:
                  to: source('statforge', 'experiments')
                  field: id
          - name: p_value
            tests:
              - not_null

      - name: experiment_observations
        description: "One row per user metric observation"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: experiment_id
            tests:
              - not_null
              - relationships:
                  to: source('statforge', 'experiments')
                  field: id
          - name: metric_value
            tests:
              - not_null
